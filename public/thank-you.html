<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Car Valuation</title>
  <meta name="description" content="Thank you for submitting your car details. We’ll be in touch shortly with your free valuation and next steps.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Thank You Section -->
  <section class="relative bg-white py-20 px-6 sm:px-10">
    <div class="max-w-2xl mx-auto text-center">
      <div class="mx-auto mb-6 w-16 h-16 flex items-center justify-center rounded-full bg-green-100">
        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h1 class="text-4xl font-bold mb-4">Thank You!</h1>
      <p class="text-lg text-gray-600 mb-6">We’ve received your details. A member of our team will be in touch shortly with your car valuation.</p>
      <p class="text-md text-gray-500">We usually respond within <span class="font-semibold text-gray-800">1 hour</span> during business hours.</p>

      <!-- CTA -->
      <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
        <a href="/" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition">
          Return to Homepage
        </a>
        <a href="/how-it-works" class="px-6 py-3 bg-gray-200 text-gray-800 rounded-xl font-semibold hover:bg-gray-300 transition">
          Learn How It Works
        </a>
      </div>
    </div>
  </section>

  <!-- Trust Signals -->
  <section class="py-12 px-6 bg-gray-50">
    <div class="max-w-5xl mx-auto text-center">
      <p class="text-gray-600 font-semibold mb-6">Trusted by thousands of car owners</p>
      <div class="flex flex-wrap justify-center items-center gap-6">
        <img src="/images/trustpilot.webp" alt="Trustpilot rating" class="h-10">
        <img src="/images/google-reviews.webp" alt="Google reviews" class="h-10">
        <img src="/images/bmw.webp" alt="BMW logo" class="h-10">
        <img src="/images/audi.webp" alt="Audi logo" class="h-10">
        <img src="/images/ford.webp" alt="Ford logo" class="h-10">
      </div>
    </div>
  </section>

</body>
</html>
